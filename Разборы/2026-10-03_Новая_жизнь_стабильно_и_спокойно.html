<script>const STAMP = "20261015163041"; const SITE_URL = "https://xparfenova-wq.github.io/myos-site/";</script>
<script>
(async function () {
  let data = JSON.parse(document.getElementById('payload').textContent);
  // Телефон держит страницу в кэше до 10 минут. Спрашиваем у сайта номер сборки мимо кэша,
  // и если он новее вшитого, забираем свежую страницу и расшифровываем уже её
  async function freshest() {
    if (!/^https?:/.test(location.protocol)) return;
    try {
      const v = (await (await fetch(SITE_URL + 'version.txt?t=' + Date.now(), { cache: 'no-store' })).text()).trim();
      if (v === STAMP) return;
      const page = await (await fetch(location.href.split('#')[0].split('?')[0] + '?t=' + Date.now(), { cache: 'no-store' })).text();
      const m = page.match(/<script id="payload" type="application\/json">([\s\S]*?)<\/script>/);
      if (m) { data = JSON.parse(m[1]); window.__myosFresh = v; }
    } catch (e) {}
  }
  window.addEventListener('pageshow', ev => { if (ev.persisted) location.reload(); });
  // Вкладка, к которой вернулись через час, сама проверяет, не вышла ли новая сборка, и перезагружается
  async function recheck() {
    if (!/^https?:/.test(location.protocol)) return;
    try {
      const v = (await (await fetch(SITE_URL + 'version.txt?t=' + Date.now(), { cache: 'no-store' })).text()).trim();
      if (v !== STAMP && v !== (window.__myosFresh || '')) location.reload();
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') recheck(); });
  window.addEventListener('focus', recheck);
  setInterval(() => { if (document.visibilityState === 'visible') recheck(); }, 5 * 60 * 1000);
  const b64 = s => { const bin = atob(s); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; };
  const form = document.getElementById('f'), inp = document.getElementById('p'), rem = document.getElementById('r'), err = document.getElementById('e');
  async function unlock(pw) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(data.salt), iterations:data.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(data.iv)}, key, b64(data.ct));
    if (!data.z) return new TextDecoder().decode(pt);
    const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  function show(htmlText) {
    // Safari: картинки из документа DOMParser после переноса не грузятся, а после document.write теряют
    // относительные пути. Поэтому все src и href делаем абсолютными ещё в тексте и вставляем в живой документ
    const base = location.href.split('#')[0];
    const abs = htmlText.replace(/(src|href)="([^"]+)"/g, (m, attr, val) => {
      if (/^(https?:|data:|#|mailto:)/.test(val)) return m;
      try { return attr + '="' + new URL(val, base).href + '"'; } catch (e) { return m; }
    });
    const inner = abs.replace(/^[\s\S]*?<html[^>]*>/i, '').replace(/<\/html>\s*$/i, '');
    document.documentElement.innerHTML = inner;
    document.documentElement.setAttribute('lang', 'ru');
    // Картинки ленивые: грузятся, когда до них долистали. Плохой считается только та, что не открылась
    // ни лёгкой копией, ни повтором через три секунды, ни исходным файлом
    const imgs = [...document.querySelectorAll('img')];
    const failed = new Set();
    const ua = navigator.userAgent;
    const os = (ua.match(/OS (\d+[_\d]*) like Mac/) || [,''])[1].replace(/_/g, '.');
    const where = /Telegram/i.test(ua) ? 'telegram' : (/CriOS/.test(ua) ? 'chrome' : (/Safari/.test(ua) ? 'safari' : 'другой'));
    const nav = document.querySelector('.myos-nav .mid');
    const tag = document.createElement('a'); tag.className = 'diag'; tag.style.cssText = 'color:#b5b0a4;font-size:11px';

    function report() {

          document.body.appendChild(banner);
        }
        banner.textContent = 'не открылись картинки: ' + failed.size + ' из ' + imgs.length + ' · ' + where + (os ? ' · iOS ' + os : '') + ' · сделай скриншот этой строки и пришли зае';
      }
    }
    imgs.forEach(img => {
      img.addEventListener('load', report);
      img.addEventListener('error', () => {
        const step = +(img.dataset.step || 0); img.dataset.step = step + 1;
        const light = img.getAttribute('src').split('?')[0];
        if (step === 0) setTimeout(() => img.setAttribute('src', light + '?r=' + Date.now()), 3000);
        else if (step === 1 && img.dataset.orig) img.setAttribute('src', img.dataset.orig);
        else { failed.add(img); report(); }
      });
    });
    report();
    window.scrollTo(0, 0);
  }
  // Телефон сам ставит заглавную в начале, вставляет двойной пробел или ё. Слово шифруется строчными,
  // поэтому ввод приводим к тому же виду, а как набрано пробуем вторым
  const norm = s => s.normalize('NFC').replace(/[\s\u00a0]+/g, ' ').trim().toLowerCase().replace(/ё/g, 'е');
  async function go(pw, remember) {
    err.textContent = 'открываю…';
    await freshest();
    let htmlText;
    const tries = [...new Set([norm(pw), pw])];
    for (const t of tries) { try { htmlText = await unlock(t); pw = t; break; } catch (e) {} }
    if (htmlText === undefined) { err.textContent = 'не то слово, попробуй ещё'; try { localStorage.removeItem('myos_pw'); } catch (x) {} return; }
    if (remember) { try { localStorage.setItem('myos_pw', pw); } catch (e) {} }
    show(htmlText);
  }
  form.addEventListener('submit', ev => { ev.preventDefault(); go(inp.value.trim(), rem.checked); });
  let saved = null; try { saved = localStorage.getItem('myos_pw'); } catch (e) {}
  let fromHash = null; try { fromHash = new URLSearchParams(location.hash.slice(1)).get('k'); } catch (e) {}
  if (fromHash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} go(fromHash, true); }
  else if (saved) { go(saved, true); } else { inp.focus(); }
})();
</script></body></html>
